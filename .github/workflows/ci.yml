name: Android OLED validation and APKs
on:
  push:
    branches: [main, android-oled-customization]
    paths-ignore: ['app/ios/**', 'app/macos/**', 'app/windows/**', 'app/linux/**', 'fastlane/**', 'support/build/**']
  pull_request:
    branches: [main]
    paths-ignore: ['app/ios/**', 'app/macos/**', 'app/windows/**', 'app/linux/**', 'fastlane/**', 'support/build/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-oled-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: "3.41.9"
  CARGO_TERM_COLOR: always
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Resolve dependencies
        run: |
          flutter pub get
          cd packages/localsend_isolates/rust_builder/cargokit/build_tool
          flutter pub get
      - name: Install pinned Rust bridge generator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          FILE=flutter_rust_bridge_codegen-x86_64-unknown-linux-musl-v2.12.0.tgz
          URL=https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.12.0
          curl -fsSL "$URL/$FILE" -o "$FILE"
          curl -fsSL "$URL/$FILE.sha256" -o "$FILE.sha256"
          printf '%s  %s\n' "$(cat "$FILE.sha256")" "$FILE" | sha256sum -c -
          tar -xzf "$FILE"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Regenerate bridge without experimental WebRTC
        working-directory: packages/localsend_isolates
        run: flutter_rust_bridge_codegen generate
      - name: Regenerate English strings and model code
        working-directory: app
        run: |
          dart run slang
          dart run build_runner build
      - name: Regenerate isolate models
        working-directory: packages/localsend_isolates
        run: dart run build_runner build
      - name: Apply mechanical Dart fixes and canonical formatting
        working-directory: app
        run: |
          dart fix --apply --code=unused_import,unnecessary_import,directives_ordering,prefer_const_constructors,prefer_const_literals_to_create_immutables
          dart format --line-length 150 lib test
      - name: Analyze the application
        working-directory: app
        run: flutter analyze
      - name: Build native library for regression tests
        run: cargo build --package rust_lib_localsend_app
      - name: Application regression tests
        working-directory: app
        run: flutter test --dart-define=EXPORT_MEDIA_QUERY=true
      - name: Isolate regression tests
        working-directory: packages/localsend_isolates
        run: flutter test
      - name: Rust clippy and protocol tests
        working-directory: packages/core
        run: |
          cargo clippy --features full --all-targets
          cargo test --features full
      - name: Rust server and integration checks
        run: |
          cargo test --package server
          cargo check --package rust_lib_localsend_app --package localsend-cli
      - name: Package generated source for reproducibility
        if: always()
        run: python3 support/scripts/package_source.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: generated-source
          path: build/LocalSend-OLED-source.zip
          if-no-files-found: error
  apk:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: generated-source
          path: generated
      - name: Use validated generated code
        run: unzip -oq generated/LocalSend-OLED-source.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-oled
          workspaces: |
            . -> target
            packages/localsend_isolates/rust_builder -> build
      - name: Build only ARMv7 and ARMv8
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols
      - name: Export the real gallery query for Android regression tests
        working-directory: app
        run: flutter test test/unit/pages/internal_gallery_page_test.dart --dart-define=EXPORT_MEDIA_QUERY=true
      - name: Android MediaStore and SQLite regression tests
        working-directory: app/android
        run: ./gradlew :app:testReleaseUnitTest --tests org.localsend.localsend_app.GalleryMediaStoreTest -Ptarget-platform=android-arm,android-arm64
      - name: Verify and summarize native gallery test results
        run: python3 support/scripts/summarize_gallery_tests.py
      - name: Verify architectures, shrinking, and removed assets
        run: python3 support/scripts/verify_android_apks.py
      - uses: actions/upload-artifact@v6
        with:
          name: LocalSend-OLED-ARMv7
          path: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: LocalSend-OLED-ARMv8
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
